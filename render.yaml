# Render blueprint for the HSR Club Dine FastAPI backend.
# Create the service: Render Dashboard → New → Blueprint → pick this repo.
# Frontend deploys separately on Vercel/Netlify (see frontend/vercel.json).
services:
  - type: web
    name: hsr-club-dine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seed the menu + tables into local JSON if missing, push them into Postgres
    # (idempotent upsert), then start the API. With DB_BACKEND=sql, orders live
    # in Postgres and survive restarts even on the free plan's ephemeral disk.
    startCommand: >-
      sh -c '[ -f data/menu_items.json ] || python -m scripts.seed_data;
      python -m scripts.migrate_json_to_sql;
      uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      # Pin Python 3.12 — pydantic-core ships prebuilt wheels for it. (Render's
      # newer default has no wheel and tries to compile it with Rust, which fails.)
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: prod
      # Postgres backend — handles concurrent order writes (a busy-rush venue).
      # "file" is single-writer and only fits a low order rate.
      - key: DB_BACKEND
        value: sql
      # Neon (or any) Postgres URL. Use Neon's *pooled* connection string. Set
      # the real value in the Render dashboard — never commit it.
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: ./data
      # Lock CORS to your deployed frontend origin(s).
      - key: CORS_ORIGINS
        value: https://dine.hsrclub.in
      # Auth secret for the customer/staff JWTs — generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # Staff dashboard password — set the real value in the Render dashboard.
      - key: ADMIN_PASSWORD
        sync: false
      # Phone OTP. Keep demo mode off in production once an SMS provider is wired.
      - key: OTP_DEMO_MODE
        value: "true"
      # Razorpay — secrets, set in the Render dashboard (not committed here).
      # Use test keys first, then live keys after KYC.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CURRENCY
        value: INR

    # With DB_BACKEND=sql you don't need a persistent disk — Postgres holds the
    # durable data. (This block is only relevant if you fall back to file mode.)
    # disk:
    #   name: hsr-club-dine-data
    #   mountPath: /var/data
    #   sizeGB: 1
